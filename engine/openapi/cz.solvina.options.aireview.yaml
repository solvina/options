openapi: 3.0.3
info:
  title: Options Engine - AI Review API
  description: >
    Contract between the engine and any AI reviewer (Claude, OpenAI, a local model, a human with
    curl). The engine owns the queue, leases, retries, deadlines and every decision; a reviewer
    only claims a task, reads its snapshot and returns a result in the fixed shape below.
    The engine interprets only `verdict` and `confidence` (and risk category/severity for
    display); everything else is stored and shown, never acted on.
    Plan: engine/docs/AI_CANDIDATE_REVIEW_PLAN.md.
  version: 1.0.0

# Reviewer endpoints (claim, result, failure, heartbeat) require `Authorization: Bearer <token>`
# (ai-review.api-token). Read endpoints follow the rest of the engine API.

paths:
  /ai-review/tasks/claim:
    post:
      tags: [AiReview]
      summary: Claim the next task this reviewer has not answered yet
      description: >
        Returns the open task with the earliest deadline that has no result from `reviewerId`,
        and grants a lease. While leased, no other instance of the same reviewer gets it. An
        expired lease makes the task claimable again. 204 when nothing is waiting, or when the
        reviewer is not enabled in ai-review.reviewers.
      operationId: claimAiReviewTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimRequest'
      responses:
        '200':
          description: A leased task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewTask'
        '204':
          description: Nothing to review
        '401':
          description: Missing or wrong token

  /ai-review/tasks/{taskId}/result:
    post:
      tags: [AiReview]
      summary: Submit a verdict
      description: >
        Accepted while the task is still open for this reviewer, even if the lease has just
        expired (a late answer is still an answer). Idempotent on (taskId, reviewerId,
        leaseToken): a retried POST of the same result returns 200. A result after the task's
        deadline is stored and scored but marked late (not used for email-before-deadline or
        gating).
      operationId: submitAiReviewResult
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewResult'
      responses:
        '200':
          description: Stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAck'
        '401':
          description: Missing or wrong token
        '404':
          description: Unknown task
        '409':
          description: This reviewer already has a different result for the task
        '422':
          description: >
            Result fails validation (unknown verdict, confidence outside 0..1, unsupported
            contractVersion, reason too long). Body says which field; the task stays open.

  /ai-review/tasks/{taskId}/failure:
    post:
      tags: [AiReview]
      summary: Report that a review could not be produced
      description: >
        The engine applies the retry policy, not the reviewer. AUTH and RATE_LIMIT never consume
        an attempt (the task is released for later); the others do, and after the configured
        maximum the task is FAILED for this reviewer.
      operationId: reportAiReviewFailure
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewFailure'
      responses:
        '200':
          description: Recorded
        '401':
          description: Missing or wrong token
        '404':
          description: Unknown task

  /ai-review/reviewers/{reviewerId}/heartbeat:
    post:
      tags: [AiReview]
      summary: Reviewer liveness and state
      description: >
        Sent every poll (~30 s), also while idle. The engine alerts when a reviewer enabled in
        ai-review.reviewers stops sending heartbeats, or reports AUTH_FAILED.
      operationId: aiReviewerHeartbeat
      parameters:
        - name: reviewerId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9][a-z0-9._-]{1,63}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Heartbeat'
      responses:
        '200':
          description: Recorded
        '401':
          description: Missing or wrong token

  /ai-review/prompts/{promptHash}:
    put:
      tags: [AiReview]
      summary: Register the full prompt text behind a promptHash
      description: >
        Kept forever so any stored result can be traced to the exact prompt. Idempotent: the
        same hash with the same text returns 200; the same hash with different text is 409.
        Reviewers call it once per prompt change (e.g. at startup).
      operationId: registerAiReviewPrompt
      parameters:
        - name: promptHash
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-f0-9]{16,64}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromptRegistration'
      responses:
        '200':
          description: Stored (or already stored with the same text)
        '401':
          description: Missing or wrong token
        '409':
          description: Hash already registered with different text

  /ai-review/reviews:
    get:
      tags: [AiReview]
      summary: Recent reviews with their results (bot /reviews, frontend, reports)
      operationId: listAiReviews
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: symbol
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 500 }
      responses:
        '200':
          description: Reviews, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReviewSummary'

  /ai-review/reviewers:
    get:
      tags: [AiReview]
      summary: Configured reviewers and their health (dashboard badge, health check)
      operationId: listAiReviewers
      responses:
        '200':
          description: Reviewer states
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReviewerStatus'

  /ai-review/report:
    get:
      tags: [AiReview]
      summary: How the primary reviewer's verdicts relate to the would-be trades (D6 evaluation)
      description: >
        Read-only analysis, never used by the engine for decisions. Cohorts group the live
        would-be trades from pool decisions by the verdict the decision saw (on time); a verdict
        that arrived later counts as NO_VERDICT_IN_TIME. Not stable for automated consumers:
        fields may be added as the evaluation evolves.
      operationId: getAiReviewReport
      parameters:
        - name: from
          in: query
          required: false
          description: Only would-be trades opened on or after this date (default = all).
          schema: { type: string, format: date }
        - name: rulesVersion
          in: query
          required: false
          description: Only titles whose review ran under this rules version.
          schema: { type: string }
      responses:
        '200':
          description: The report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiReviewReport'

components:
  parameters:
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    ClaimRequest:
      type: object
      required: [reviewerId, contractVersions]
      properties:
        reviewerId:
          type: string
          description: >
            Stable id of a reviewer configuration, e.g. "claude-opus", "openai-gpt". Results are
            grouped and scored by it. A new model or prompt that should be judged separately
            gets a new id; a minor prompt tweak only bumps promptVersion.
          pattern: '^[a-z0-9][a-z0-9._-]{1,63}$'
        contractVersions:
          type: array
          description: Result contract versions this reviewer can produce (currently ["1"]).
          items: { type: string }
        snapshotVersions:
          type: array
          description: Snapshot major versions it can read; the engine skips tasks it cannot.
          items: { type: integer }

    ReviewTask:
      type: object
      required: [taskId, leaseToken, leaseExpiresAt, deadlineAt, tradingDate, strategyId, symbol, snapshotVersion, snapshot]
      properties:
        taskId: { type: string, format: uuid }
        leaseToken: { type: string, description: 'Echoed back on result/failure.' }
        leaseExpiresAt: { type: string, format: date-time }
        deadlineAt:
          type: string
          format: date-time
          description: The next pool decision this review can still influence.
        tradingDate: { type: string, format: date, description: 'NY trading date.' }
        strategyId: { type: string, enum: [BULL_PUT, BEAR_CALL] }
        symbol: { type: string }
        attempt: { type: integer, description: '1-based attempt for this reviewer.' }
        snapshotVersion:
          type: integer
          description: Major version. Within a major version fields are only ever added.
        snapshot:
          type: object
          additionalProperties: true
          description: >
            Frozen market context at the moment the title first qualified (ReviewSnapshotV1 in the
            engine: candidate, trend, iv, calendar, portfolio, trackRecord, rulesVersion, and later
            priceStats, dailyBarsCsv, news). Market data here is authoritative. Sections may be
            null; reviewers must tolerate that and ignore unknown fields. `portfolio` is null for
            reviewers configured without include-portfolio.

    ReviewResult:
      type: object
      required: [reviewerId, leaseToken, contractVersion, verdict, confidence, reason]
      properties:
        reviewerId: { type: string }
        leaseToken: { type: string }
        contractVersion: { type: string, enum: ['1'] }
        verdict:
          type: string
          enum: [APPROVE, VETO, ABSTAIN]
          description: >
            The only field with engine semantics. VETO may block an entry, and only when gating
            is enabled for this reviewer. APPROVE never overrides a rule rejection. ABSTAIN =
            "no opinion" and is treated like a missing verdict.
        confidence: { type: number, minimum: 0, maximum: 1 }
        reason: { type: string, maxLength: 600, description: 'One paragraph, shown in email/Telegram.' }
        risks:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/Risk'
        newsSummary: { type: string, maxLength: 4000 }
        preferredStrategy:
          type: string
          enum: [BULL_PUT, BEAR_CALL, NONE]
          description: >
            Which credit spread the reviewer would sell on this name right now, whatever the
            reviewed strategy: BULL_PUT, BEAR_CALL, or NONE for neither. Advisory only: the engine
            records it and follows the other strategy as a would-be trade, it never trades on it.
        sources:
          type: array
          maxItems: 30
          description: What the reviewer actually read. Reviews cannot be replayed later (news moves on); this is the record.
          items:
            $ref: '#/components/schemas/Source'
        provenance:
          $ref: '#/components/schemas/Provenance'
        rawResponse:
          type: string
          maxLength: 200000
          description: The model's unparsed output, kept for audits and re-parsing.
        extras:
          type: object
          additionalProperties: true
          description: Anything else the reviewer wants kept. Stored, never interpreted.

    Risk:
      type: object
      required: [category, severity, description]
      properties:
        category:
          type: string
          maxLength: 40
          description: >
            One of EARNINGS, NEWS, EVENT, MACRO, SECTOR, TECHNICAL, VOLATILITY, LIQUIDITY, SETUP,
            OTHER. Not an enum on purpose: an unknown value is stored as OTHER instead of failing
            the whole result.
        severity: { type: string, enum: [LOW, MEDIUM, HIGH] }
        description: { type: string, maxLength: 300 }

    Source:
      type: object
      required: [title]
      properties:
        title: { type: string }
        url: { type: string }
        publishedAt: { type: string, format: date-time }
        excerpt: { type: string, maxLength: 1000 }

    Provenance:
      type: object
      description: Stored as-is for grouping in reports; the engine never branches on it.
      properties:
        provider: { type: string, description: 'e.g. anthropic, openai' }
        model: { type: string }
        promptVersion: { type: string }
        promptHash: { type: string, description: 'sha256 (hex) of the full prompt template; see PUT /ai-review/prompts/{promptHash}.' }
        reviewerVersion: { type: string }
        durationMs: { type: integer, format: int64 }
        inputTokens: { type: integer, format: int64 }
        outputTokens: { type: integer, format: int64 }

    PromptRegistration:
      type: object
      required: [reviewerId, promptVersion, text]
      properties:
        reviewerId: { type: string }
        promptVersion: { type: string }
        text: { type: string, maxLength: 200000 }

    ResultAck:
      type: object
      properties:
        late: { type: boolean, description: 'Arrived after deadlineAt.' }

    ReviewFailure:
      type: object
      required: [reviewerId, leaseToken, kind, message]
      properties:
        reviewerId: { type: string }
        leaseToken: { type: string }
        kind:
          type: string
          enum: [AUTH, RATE_LIMIT, TIMEOUT, PROVIDER_ERROR, INVALID_OUTPUT, OTHER]
        message: { type: string, maxLength: 2000 }

    Heartbeat:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [READY, BUSY, PAUSED, AUTH_FAILED, DEGRADED]
          description: PAUSED = waiting on purpose (build running, memory); DEGRADED = working but failing often.
        message: { type: string, maxLength: 500 }
        provider: { type: string }
        model: { type: string }
        reviewerVersion: { type: string }

    ReviewSummary:
      type: object
      properties:
        taskId: { type: string, format: uuid }
        tradingDate: { type: string, format: date }
        strategyId: { type: string }
        symbol: { type: string }
        expiry: { type: string, format: date }
        shortStrike: { type: number }
        longStrike: { type: number }
        createdAt: { type: string, format: date-time }
        deadlineAt: { type: string, format: date-time }
        results:
          type: array
          items:
            type: object
            properties:
              reviewerId: { type: string }
              status: { type: string, enum: [PENDING, IN_PROGRESS, DONE, FAILED, EXPIRED] }
              verdict: { type: string, enum: [APPROVE, VETO, ABSTAIN] }
              confidence: { type: number }
              reason: { type: string }
              late: { type: boolean }
              completedAt: { type: string, format: date-time }
              model: { type: string }

    ReviewerStatus:
      type: object
      properties:
        reviewerId: { type: string }
        enabled: { type: boolean }
        primary: { type: boolean }
        gating: { type: boolean }
        state: { type: string, enum: [READY, BUSY, PAUSED, AUTH_FAILED, DEGRADED, SILENT] }
        lastHeartbeatAt: { type: string, format: date-time }
        lastResultAt: { type: string, format: date-time }
        lastFailure: { type: string }
        model: { type: string }

    AiReviewReport:
      type: object
      required: [reviewerId, generatedAt, cohorts, rulesOnly, withAi, removedByAi, addedByAi, calibration, rulesVersions, decisions]
      properties:
        reviewerId: { type: string, description: The primary reviewer the layer uses }
        generatedAt: { type: string, format: date-time }
        from: { type: string, format: date, nullable: true }
        rulesVersion: { type: string, nullable: true }
        cohorts:
          type: array
          description: Every ranked live would-be trade, by the verdict its decision saw.
          items: { $ref: '#/components/schemas/ReportCohort' }
        rulesOnly: { $ref: '#/components/schemas/ReportCohort' }
        withAi: { $ref: '#/components/schemas/ReportCohort' }
        removedByAi: { $ref: '#/components/schemas/ReportCohort' }
        addedByAi: { $ref: '#/components/schemas/ReportCohort' }
        lossesAvoidedMinusWinsForgone:
          type: number
          description: Minus the realized P&L of vetoed would-be trades (positive = the vetoes helped).
        approveMinusVeto:
          $ref: '#/components/schemas/ReportDifference'
        calibration:
          type: array
          items: { $ref: '#/components/schemas/ReportCalibrationBucket' }
        rulesVersions:
          type: array
          description: Rule configurations seen by reviews, oldest first; a new one is a marker on the timeline.
          items: { $ref: '#/components/schemas/ReportRulesVersion' }
        decisions:
          type: object
          additionalProperties: { type: integer }
          description: Reviewed tasks by what the decision did with them (RECORDED, ALREADY_HELD, DROPPED, ...).
        wouldGate: { type: integer, description: Reviewed titles gating would have blocked }
        candidates:
          type: array
          description: Every reviewed title as a would-be trade from its first qualification, by the primary verdict (no veto applied).
          items: { $ref: '#/components/schemas/ReportCohort' }
        candidateApproveMinusVeto:
          $ref: '#/components/schemas/ReportDifference'
        candidateLossesAvoidedMinusWinsForgone:
          type: number
          description: Minus the realized P&L of vetoed candidate trades (positive = the vetoes helped).
        preferred:
          type: array
          description: The other spread the reviewer said it would rather sell, followed as a would-be trade (AI_PREFERRED), by strategy.
          items: { $ref: '#/components/schemas/ReportCohort' }

    ReportCohort:
      type: object
      required: [label, count, closed, wins, realizedPnl, open, markedPnl, tradingDays]
      properties:
        label: { type: string }
        count: { type: integer }
        closed: { type: integer }
        wins: { type: integer }
        winRate: { type: number, nullable: true }
        realizedPnl: { type: number, description: 'USD per contract at mid, closed trades' }
        avgPnl: { type: number, nullable: true }
        open: { type: integer }
        markedPnl: { type: number, description: Open trades marked to their last value }
        tradingDays: { type: integer, description: Distinct decision days (same-day trades move together) }

    ReportDifference:
      type: object
      required: [mean, approveClosed, vetoClosed]
      properties:
        mean: { type: number, description: Average realized P&L per APPROVE trade minus per VETO trade }
        low: { type: number, nullable: true, description: '90% interval, bootstrap over trading days' }
        high: { type: number, nullable: true }
        approveClosed: { type: integer }
        vetoClosed: { type: integer }

    ReportCalibrationBucket:
      type: object
      required: [low, high, closed, right]
      properties:
        low: { type: number }
        high: { type: number }
        closed: { type: integer }
        right: { type: integer, description: APPROVE that won or VETO that lost }

    ReportRulesVersion:
      type: object
      required: [version, firstSeenAt, tasks]
      properties:
        version: { type: string }
        firstSeenAt: { type: string, format: date-time }
        tasks: { type: integer }
